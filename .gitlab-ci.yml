# GitLab CI/CD for cocotbext-ral
#
# Automatically installs the package site-wide when a version tag (v*) is pushed.
# The 'chiplet-ip-release' runner tag runs as socinfra, which has write access
# to the site-wide Python installation at /tools_soc/opensrc/python/.
#
# Usage:
#   git tag v0.5.0
#   git push origin v0.5.0
#
# This triggers the 'release' job which pip-installs the tagged version.

stages:
  - test
  - release

# Run basic tests on every push/MR
test:
  stage: test
  tags:
    - chiplet-ip
  script:
    - python3 -m pytest tests/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Install site-wide on version tags (runs as socinfra via chiplet-ip-release runner)
release:
  stage: release
  tags:
    - chiplet-ip-release
  script:
    - echo "Installing cocotbext-ral $CI_COMMIT_TAG site-wide..."
    - pip install --upgrade . --no-deps
    - python3 -c "import cocotbext.ral; print(f'Installed cocotbext-ral {cocotbext.ral.__version__}')"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
  resource_group: cocotbext-ral-release
