[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-ral"
dynamic = ["version"]
description = "Python-native Register Abstraction Layer (RAL) for cocotb with a data-driven runtime architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["cocotb", "ral", "register model", "verification", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: cocotb",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
# Works with both cocotb 1.x and 2.x. NOTE: under cocotb 2.x you need a
# cocotbext-axi build that is itself cocotb-2.x compatible (the public
# release may lag; use a patched/forked build if needed).
cocotb = ["cocotb>=1.8.0", "cocotbext-axi>=0.1.16"]
rdl = ["systemrdl-compiler>=1.15"]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.8"]
all = ["cocotbext-ral[cocotb,rdl,dev]"]

[project.urls]
Homepage = "https://github.com/stephencoTT/cocotbext-ral"
Issues = "https://github.com/stephencoTT/cocotbext-ral/issues"

[tool.setuptools.dynamic]
version = {attr = "cocotbext.ral.version.__version__"}

[tool.setuptools.packages.find]
include = ["cocotbext.*"]

[tool.setuptools.package-data]
"cocotbext.ral" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# E731: assigning a lambda to a name is fine for the concise field/name
# matchers in register_model.find_registers / find_fields.
ignore = ["E731"]

[tool.mypy]
python_version = "3.9"
files = ["cocotbext"]
ignore_missing_imports = true
# Pragmatic baseline: catch real type regressions without demanding full
# strictness on a codebase that interops with dynamically-typed cocotb.
no_implicit_optional = true
