[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-ral"
dynamic = ["version"]
description = "Python-native Register Abstraction Layer (RAL) for cocotb with a data-driven runtime architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["cocotb", "ral", "register model", "verification", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: cocotb",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
cocotb = ["cocotb>=1.8.0", "cocotbext-axi>=0.1.16"]
rdl = ["systemrdl-compiler>=1.15"]
dev = ["pytest>=7.0"]
all = ["cocotbext-ral[cocotb,rdl,dev]"]

[project.urls]
Homepage = "https://github.com/stephencoTT/cocotbext-ral"
Issues = "https://github.com/stephencoTT/cocotbext-ral/issues"

[tool.setuptools.dynamic]
version = {attr = "cocotbext.ral.version.__version__"}

[tool.setuptools.packages.find]
include = ["cocotbext.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
